[project]
name = "git-repo-status-check"
version = "0.1.0"
description = "Scan configured folders for git repos with uncommitted changes."
requires-python = ">=3.11"
dependencies = [
    "pick[blessed]>=2.6.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
git-repo-status-check = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_repo_status_check"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "."]
extend-exclude = [".claude"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
