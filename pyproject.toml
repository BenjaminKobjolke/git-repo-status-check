[project]
name = "git-repo-status-check"
version = "0.1.0"
description = "Scan configured folders for git repos with uncommitted changes."
requires-python = ">=3.11"
dependencies = [
    "pick[blessed]>=2.6.0",
    "pyside6>=6.11.2",
    "python-localization",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
git-repo-status-check = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_repo_status_check"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "."]
extend-exclude = [".claude"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.uv.sources]
python-localization = { git = "https://github.com/BenjaminKobjolke/python-localization.git" }

[[tool.mypy.overrides]]
# python-localization ships no py.typed marker; its API is small and used through gui/i18n.py only.
module = "python_localization.*"
ignore_missing_imports = true
